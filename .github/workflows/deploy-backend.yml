name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-c98d2dac-2409-44bd-aba
  REGION: asia-south1
  GAR_REPOSITORY: cloud-run-agent
  SERVICE: ai-cicd-agent
  DEPLOYER_SA: github-cloud-run-deployer@project-c98d2dac-2409-44bd-aba.iam.gserviceaccount.com
  WIF_PROVIDER: projects/785312592182/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
  RUNTIME_SA: ai-cicd-agent-runtime@project-c98d2dac-2409-44bd-aba.iam.gserviceaccount.com
  GEMINI_MODEL: gemini-2.5-flash-lite
  GOOGLE_CLOUD_LOCATION: global
  CLOUD_RUN_REGION: asia-south1
  SQL_INSTANCE: ai-cicd-agent-db
  SQL_CONNECTION_NAME: project-c98d2dac-2409-44bd-aba:asia-south1:ai-cicd-agent-db
  DB_NAME: agentdb
  SERVICE_URL: https://ai-cicd-agent-785312592182.asia-south1.run.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Controlled incident demo failure
        run: |
          if [ -f backend/DEMO_FAIL ]; then
            echo "DEMO_INCIDENT: controlled deployment failure requested"
            echo "Remove backend/DEMO_FAIL to restore the deployment."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }} \
            ./backend

      - name: Push image
        run: |
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: >-
            --service-account=${{ env.RUNTIME_SA }}
            --add-cloudsql-instances=${{ env.SQL_CONNECTION_NAME }}
            --set-secrets=DB_USER=cloud-sql-db-user:latest,DB_PASSWORD=cloud-sql-db-password:latest
          env_vars: |
            GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}
            GOOGLE_CLOUD_LOCATION=${{ env.GOOGLE_CLOUD_LOCATION }}
            CLOUD_RUN_REGION=${{ env.CLOUD_RUN_REGION }}
            GEMINI_MODEL=${{ env.GEMINI_MODEL }}
            CLOUD_RUN_SERVICE=${{ env.SERVICE }}
            INSTANCE_CONNECTION_NAME=${{ env.SQL_CONNECTION_NAME }}
            DB_NAME=${{ env.DB_NAME }}

      - name: Post-fix verification
        run: |
          set -euo pipefail
          echo "Verifying deployed service: $SERVICE_URL"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$SERVICE_URL/health"
          echo
          echo "POST-FIX VERIFICATION: PASSED"
