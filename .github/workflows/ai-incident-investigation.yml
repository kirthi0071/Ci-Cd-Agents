name: AI Incident Investigation

on:
  workflow_run:
    workflows: [Deploy Backend]
    types: [completed]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  investigate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Collect failed deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          AGENT_URL: https://ai-cicd-agent-jeal5mhmha-el.a.run.app
        run: |
          set -euo pipefail
          mkdir -p investigation

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")"
          gh run view "$RUN_ID" --log-failed > investigation/failed.log || true

          python - <<'PY' "$run_json" "$jobs_json" "investigation/failed.log"
          import json
          import sys

          run = json.loads(sys.argv[1])
          jobs = json.loads(sys.argv[2]).get("jobs", [])
          log_file = sys.argv[3]
          failed_jobs = [job for job in jobs if job.get("conclusion") == "failure"]

          with open(log_file, encoding="utf-8", errors="replace") as handle:
              lines = handle.read().splitlines()

          patterns = (
              "error", "exception", "failed", "failure", "traceback",
              "modulenotfounderror", "permission denied", "exit code",
              "demo_incident",
          )
          matches = []
          for raw in lines:
              line = raw.strip()
              if not line or len(line) > 500:
                  continue
              if any(pattern in line.lower() for pattern in patterns):
                  if line not in matches:
                      matches.append(line)
              if len(matches) >= 30:
                  break

          evidence = {
              "incident": {
                  "id": "INC-1024",
                  "service": "ai-cicd-agent",
                  "environment": "production",
                  "severity": "HIGH",
                  "status": "INVESTIGATING",
                  "summary": f"GitHub Actions deployment run #{run.get('run_number')} failed.",
                  "deployment": {
                      "id": run.get("id"),
                      "workflow": run.get("name"),
                      "run_number": run.get("run_number"),
                      "commit": (run.get("head_sha") or "")[:7],
                      "url": run.get("html_url"),
                  },
              },
              "evidence": [
                  {
                      "source": "github_actions",
                      "type": "workflow_run",
                      "finding": f"{run.get('name', 'GitHub Actions')} run #{run.get('run_number')} failed",
                      "run_id": run.get("id"),
                      "commit": (run.get("head_sha") or "")[:7],
                      "url": run.get("html_url"),
                  }
              ],
          }

          for index, job in enumerate(failed_jobs[:3]):
              evidence["evidence"].append({
                  "source": "github_actions",
                  "type": "job",
                  "finding": f"Job '{job.get('name')}' failed",
                  "job_id": job.get("id"),
                  "url": job.get("html_url"),
                  "log_evidence": matches if index == 0 else [],
              })

          with open("investigation/evidence.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle)
          print(json.dumps(evidence, indent=2))
          PY

          python - <<'PY'
          import json
          import os
          import urllib.request

          with open("investigation/evidence.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          agent_url = os.environ["AGENT_URL"]
          request = urllib.request.Request(
              f"{agent_url}/api/v1/incidents/INC-1024/investigation",
              data=json.dumps({"source_evidence": payload}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              result = response.read().decode()
          with open("investigation/INC-1024.json", "w", encoding="utf-8") as handle:
              handle.write(result)
          print(result)
          PY

      - name: Create remediation PR for controlled demo incident
        if: ${{ hashFiles('backend/DEMO_FAIL') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          BRANCH="agent/remediate-inc-${RUN_ID}"
          git switch -c "$BRANCH"
          rm backend/DEMO_FAIL
          git config user.name "AI CI/CD Agent"
          git config user.email "ai-cicd-agent@users.noreply.github.com"
          git add backend/DEMO_FAIL
          git commit -m "fix(agent): remediate controlled deployment incident"
          git push --set-upstream origin "$BRANCH"

          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("investigation/INC-1024.json").read_text())
          investigation = result.get("investigation", {})
          evidence = investigation.get("evidence", [])
          evidence_text = "\n".join(f"- {item}" for item in evidence) or "- See investigation artifact"
          body = f'''## AI CI/CD Agent remediation

The deployment failed and the AI investigation produced the following diagnosis.

### Root cause
{investigation.get("root_cause", "Controlled demo deployment failure")}

### Category
{investigation.get("category", "UNKNOWN")}

### Confidence
{investigation.get("confidence", "N/A")}

### Evidence
{evidence_text}

### Recommended fix
{investigation.get("recommended_fix", "Remove the controlled demo failure marker and rerun CI/CD.")}

### Automated remediation
- Failed Deploy Backend run: {RUN_ID}
- Remediation: remove `backend/DEMO_FAIL`
- Human approval is required before merge.

After merge, Deploy Backend will run again and the verification workflow will check Cloud Run health.'''
          Path("investigation/pr-body.md").write_text(body)
          PY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(agent): remediate deployment incident #${RUN_ID}" \
            --body-file investigation/pr-body.md

      - name: Upload investigation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-incident-investigation-${{ github.event.workflow_run.id }}
          path: investigation/*.json
          if-no-files-found: error

  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify Cloud Run health after successful deployment
        env:
          AGENT_URL: https://ai-cicd-agent-jeal5mhmha-el.a.run.app
        run: |
          set -euo pipefail
          echo "Verifying deployed service: ${AGENT_URL}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "${AGENT_URL}/health"
          echo
          echo "POST-FIX VERIFICATION: PASSED"

      - name: Record resolved deployment
        run: |
          mkdir -p verification
          cat > verification/result.json <<EOF
          {
            "status": "RESOLVED",
            "workflow_run_id": "${{ github.event.workflow_run.id }}",
            "workflow_run_number": "${{ github.event.workflow_run.run_number }}",
            "verification": "Cloud Run /health returned HTTP 200"
          }
          EOF

      - name: Upload verification result
        uses: actions/upload-artifact@v4
        with:
          name: post-fix-verification-${{ github.event.workflow_run.id }}
          path: verification/result.json
          if-no-files-found: error
