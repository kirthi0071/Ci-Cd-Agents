name: AI Incident Investigation

on:
  workflow_run:
    workflows: [Deploy Backend]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  investigate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Investigate failed deployment
        env:
          AGENT_URL: https://ai-cicd-agent-jeal5mhmha-el.a.run.app
        run: |
          set -euo pipefail
          mkdir -p investigation
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "$AGENT_URL/api/v1/incidents/INC-1024/investigation" \
            -o investigation/INC-1024.json
          cat investigation/INC-1024.json

      - name: Upload investigation evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-incident-investigation-${{ github.event.workflow_run.id }}
          path: investigation/INC-1024.json
          if-no-files-found: error
